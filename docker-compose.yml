# PHONEINTEL production / staging stack.
#
#   cp .env.example .env            # fill in every required value (see docs/DEPLOYMENT.md)
#   docker compose up -d --build    # postgres, redis, migrate (one-shot), api, worker, caddy
#   docker compose exec api python -m app.manage create-admin --email you@example.org
#   docker compose exec api python -m app.manage create-service-account --name telegram-bot
#   docker compose --profile bot up -d          # Telegram bot (needs BOT_SERVICE_API_KEY)
#   docker compose --profile monitoring up -d   # Prometheus on 127.0.0.1:9090
#   docker compose --profile backup run --rm backup
#
# Networks:
#   backend  internal only (no internet, nothing published): postgres, redis and their clients.
#   edge     internet egress + the public reverse proxy. Caddy has a fixed address, which is the
#            only source the API trusts for X-Forwarded-* headers.

x-backend-image: &backend-image
  image: phoneintel/backend:${IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: infrastructure/Dockerfile.backend
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: "true"
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:?BLIND_INDEX_KEY is required}
  FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:?FIELD_ENCRYPTION_KEYS is required}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-phoneintel}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-phoneintel}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  JOB_BACKEND: arq
  TRUSTED_HOSTS: ${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME is required},api,127.0.0.1
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  FORCE_HTTPS: ${FORCE_HTTPS:-true}
  ENABLE_DOCS: ${ENABLE_DOCS:-false}
  REGISTRATION_OPEN: ${REGISTRATION_OPEN:-false}
  METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  RETENTION_INVESTIGATION_DAYS: ${RETENTION_INVESTIGATION_DAYS:-90}
  RETENTION_EVIDENCE_DAYS: ${RETENTION_EVIDENCE_DAYS:-30}
  RETENTION_AUDIT_DAYS: ${RETENTION_AUDIT_DAYS:-365}
  # Optional providers. Empty values are treated as "not configured".
  BRAVE_API_KEY: ${BRAVE_API_KEY:-}
  GOOGLE_CSE_API_KEY: ${GOOGLE_CSE_API_KEY:-}
  GOOGLE_CSE_CX: ${GOOGLE_CSE_CX:-}
  SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
  REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
  REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phoneintel}
      POSTGRES_USER: ${POSTGRES_USER:-phoneintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    <<: *backend-image
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    networks: [backend]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend-image
    environment:
      <<: *backend-env
      FORWARDED_ALLOW_IPS: ${CADDY_IP:-172.30.10.10}
    networks: [backend, edge]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *backend-image
    command: ["arq", "app.workers.worker.WorkerSettings"]
    environment: *backend-env
    networks: [backend, edge]
    healthcheck:
      test: ["CMD", "arq", "--check", "app.workers.worker.WorkerSettings"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: ${CADDY_IP:-172.30.10.10}
        # The bot reaches the API through Caddy (real TLS) using the public name.
        aliases: ["${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME is required}"]
    depends_on:
      api:
        condition: service_healthy

  bot:
    profiles: [bot]
    image: phoneintel/bot:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.bot
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required for the bot}
      BOT_SERVICE_API_KEY: ${BOT_SERVICE_API_KEY:?BOT_SERVICE_API_KEY is required for the bot}
      PHONEINTEL_API_URL: https://${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME is required}
      BOT_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1
      BOT_ALLOWED_USER_IDS: ${BOT_ALLOWED_USER_IDS:-}
      BOT_RATE_LIMIT_PER_MINUTE: ${BOT_RATE_LIMIT_PER_MINUTE:-20}
      BOT_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks: [backend, edge]
    depends_on:
      caddy:
        condition: service_started
      redis:
        condition: service_healthy

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    secrets: [metrics_token]
    ports:
      - "127.0.0.1:9090:9090"
    networks: [backend, edge]

  backup:
    profiles: [backup]
    image: postgres:16-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-phoneintel}
      POSTGRES_USER: ${POSTGRES_USER:-phoneintel}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./infrastructure/scripts/backup.sh:/backup.sh:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

secrets:
  metrics_token:
    environment: METRICS_TOKEN

networks:
  backend:
    internal: true
  edge:
    ipam:
      config:
        # Dynamic addresses come from the upper half; Caddy's fixed address sits below it.
        - subnet: 172.30.10.0/24
          ip_range: 172.30.10.128/25

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  prometheus_data:
