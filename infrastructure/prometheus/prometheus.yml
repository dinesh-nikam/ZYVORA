global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: phoneintel-api
    metrics_path: /metrics
    # /metrics requires the METRICS_TOKEN bearer token (mounted as a compose secret).
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]
