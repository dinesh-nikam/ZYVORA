[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "phoneintel-cli"
version = "1.0.0"
description = "PHONEINTEL command-line client (Linux, macOS, Windows PowerShell, Android Termux)"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "typer>=0.13",
    "rich>=13.9",
    "httpx>=0.28",
]

[project.scripts]
phoneintel = "phoneintel_cli.main:run"

[tool.hatch.build.targets.wheel]
packages = ["phoneintel_cli"]
